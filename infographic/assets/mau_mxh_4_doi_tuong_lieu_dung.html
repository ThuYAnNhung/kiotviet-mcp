<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!--
  ẢNH 4 – MXH ĐỐI TƯỢNG & LIỀU DÙNG. Liều chép đúng nhãn theo từng loài. Chỉ có logo, không liên hệ.
  Khung 9:16, 1536 x 2731 px. Kiểu chữ, cỡ chữ, bố cục chung nằm trong an_nhung.css (không sửa cỡ chữ).
  - {{MAU}}, {{MAU_DAM}}, {{MAU_O1}}..{{MAU_O4}}: chạy lay_mau_bao_bi.py <anh_san_pham> --html <các file> để tự điền.
  - {{CAM_KET}}: câu cam kết chính hãng viết riêng cho từng sản phẩm, bắt đầu bằng "✔", tối đa ~55 ký tự,
    không ghi "ủy quyền"; "có số đăng ký lưu hành" chỉ ghi khi có SĐK thật.
  - Thay mọi {{...}} còn lại bằng nội dung thật; dòng thừa thì xoá thẻ <li>/<span>. Thiếu thông tin thì xoá cả ô.
  - Ô Đối tượng: mỗi loài một <div class="loai"> với ký tự Noto Emoji (🐖 🐄 🐃 🐐 🐑 🐔 🦆 🐕 🐈 🐇 🐟 🦐 🐎).
-->
<link rel="stylesheet" href="an_nhung.css">
<style>
  :root { --mau: {{MAU}}; --mau-dam: {{MAU_DAM}};
          --o-tp: {{MAU_O1}}; --o-dt: {{MAU_O2}}; --o-cd: {{MAU_O3}}; --o-ld: {{MAU_O4}}; }
</style>
</head>
<body>
<div class="khung">
  <img class="nen" src="nen_chim.png" alt="">

  <div class="dau"><img class="logo" src="logo_annhung.png" alt="An Nhung"></div>

  <div class="tieu-de">{{TIEU_DE}}</div>
  <div class="phu-de">{{PHU_DE}}</div>

  <div class="san-pham"><div class="buc"></div><img src="{{ANH_SAN_PHAM}}" alt=""></div>

  <div class="luoi mot-cot">
    <div class="o dt"><h3><span class="ic">🐾</span>ĐỐI TƯỢNG</h3>
      <div class="loai-ds">
        <div class="loai"><div class="hinh">{{EMOJI_LOAI_1}}</div><div class="ten">{{TEN_LOAI_1}}</div></div>
        <div class="loai"><div class="hinh">{{EMOJI_LOAI_2}}</div><div class="ten">{{TEN_LOAI_2}}</div></div>
      </div></div>
    <div class="o ld"><h3><span class="ic">💉</span>LIỀU DÙNG</h3>
      <ul><li>{{LD_1}}</li><li>{{LD_2}}</li><li>{{LD_3}}</li><li>{{LD_4}}</li></ul></div>
  </div>

  <div class="dai">
    <span><b>Đường dùng:</b> {{DUONG_DUNG}}</span>
    <span><b>Ngừng thuốc:</b> {{NGUNG_THUOC}}</span>
  </div>

  <!-- Ảnh mạng xã hội: KHÔNG số điện thoại, địa chỉ, website, mã QR -->
  <div class="chan">
    <div class="cam-ket">{{CAM_KET}}</div>
    <div class="slogan">NPP Thú Y An Nhung · Xây dựng niềm tin – Khẳng định thương hiệu</div>
  </div>
</div>
</body>
</html>
