<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<!--
  ẢNH 5 – MXH TƯ VẤN SỬ DỤNG: 3–4 ý từ mục 💡 của mô tả + Quy cách / SĐK / Bảo quản. Chỉ có logo, không liên hệ.
  Khung 9:16, 1536 x 2731 px. Kiểu chữ, cỡ chữ, bố cục chung nằm trong an_nhung.css (không sửa cỡ chữ).
  - {{MAU}}, {{MAU_DAM}}, {{MAU_O1}}..{{MAU_O4}}: chạy lay_mau_bao_bi.py <anh_san_pham> --html <các file> để tự điền.
  - Chân trang chính hãng: {{NHA_SAN_XUAT}} = tên công ty sản xuất in trên nhãn (dài thì viết gọn, ví dụ "CP Thuốc thú y
    Trung ương NAVETCO"); {{SDK}} = số đăng ký in trên sản phẩm. Không có SĐK (dụng cụ) thì xoá cả thẻ <span class="sdk">.
  - Nền: <body class="nen-mau"> = nền là màu chủ đạo bao bì (tao_nen_chim.py --kieu-nen mau);
    bỏ class này = nền trắng pha nhạt màu bao bì (--kieu-nen nhat).
  - Thay mọi {{...}} còn lại bằng nội dung thật; dòng thừa thì xoá thẻ <li>/<span>. Thiếu thông tin thì xoá cả ô.
-->
<link rel="stylesheet" href="an_nhung.css">
<style>
  :root { --mau: {{MAU}}; --mau-dam: {{MAU_DAM}};
          --o-tp: {{MAU_O1}}; --o-dt: {{MAU_O2}}; --o-cd: {{MAU_O3}}; --o-ld: {{MAU_O4}}; }
</style>
</head>
<body class="nen-mau">
<div class="khung">
  <img class="nen" src="nen_chim.png" alt="">

  <div class="dau"><img class="logo" src="logo_annhung.png" alt="An Nhung"></div>

  <div class="tieu-de">{{TIEU_DE}}</div>
  <div class="phu-de">{{PHU_DE}}</div>

  <div class="san-pham"><div class="buc"></div><img src="{{ANH_SAN_PHAM}}" alt=""></div>

  <div class="luoi mot-cot">
    <div class="o tv"><h3><span class="ic">💡</span>TƯ VẤN SỬ DỤNG</h3>
      <ul><li>{{TV_1}}</li><li>{{TV_2}}</li><li>{{TV_3}}</li><li>{{TV_4}}</li></ul></div>
  </div>

  <div class="dai">
    <span><b>Quy cách:</b> {{QUY_CACH}}</span>
    <span><b>SĐK:</b> {{SDK}}</span>
    <span><b>Bảo quản:</b> {{BAO_QUAN}}</span>
  </div>

  <!-- Ảnh mạng xã hội: KHÔNG số điện thoại, địa chỉ, website, mã QR -->
  <div class="chan">
    <div class="cam-ket">✔ Hàng chính hãng từ công ty {{NHA_SAN_XUAT}}<span class="sdk">Số đăng ký lưu hành: {{SDK}}</span></div>
    <div class="slogan">NPP Thú Y An Nhung · Xây dựng niềm tin – Khẳng định thương hiệu</div>
  </div>
</div>
</body>
</html>
